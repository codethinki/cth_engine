name: Windows Pipeline

on:
  workflow_call:
    inputs:
      compiler:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  # build only: the runners have no vulkan driver, the tests need a device
  build:
    name: Windows (${{ inputs.compiler }})
    runs-on: windows-latest
    defaults:
      run:
        shell: bash # Forces Git Bash for consistency with Linux scripts

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-windows
        with:
          compiler: ${{ inputs.compiler }}

      #TEMP buildcache diagnosis: the most verbose log of buildcache for the clang build
      - name: Enable BuildCache log
        if: inputs.compiler == 'clang'
        run: |
          echo "BUILDCACHE_DEBUG=1" >> "$GITHUB_ENV"
          echo "BUILDCACHE_LOG_FILE=$RUNNER_TEMP/buildcache.log" >> "$GITHUB_ENV"

      - name: Build
        uses: ./.github/actions/build-engine
        with:
          cache_prefix: engine-windows
          preset: ci_windows_${{ inputs.compiler }}

      #TEMP buildcache diagnosis: the log also of a failed build
      - name: Upload BuildCache log
        if: always() && inputs.compiler == 'clang'
        uses: actions/upload-artifact@v7
        with:
          name: buildcache-log-windows-clang
          path: ${{ runner.temp }}/buildcache.log
