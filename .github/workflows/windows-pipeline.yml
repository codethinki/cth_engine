name: Windows Pipeline

on:
  workflow_call:
    inputs:
      compiler:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  # build only: the runners have no vulkan driver, the tests need a device
  build:
    name: Windows (${{ inputs.compiler }})
    runs-on: windows-latest
    #TEMP buildcache direct mode gives stale precompiled headers
    # - direct mode keys on the headers of clang -H, -H does not list the headers of -include
    # - CMake includes the precompiled header with -include: a changed header of it still hits,
    #   the build takes the old precompiled header and old objects, no error
    # - only Windows: buildcache 0.31.7 of this job has direct mode on by default, the
    #   buildcache-git 0.28.1 of the Linux image (cachyos repo) has it off
    # - remove when direct mode takes its inputs from the depfile or the -include operands
    env:
      BUILDCACHE_DIRECT_MODE: false
    defaults:
      run:
        shell: bash # Forces Git Bash for consistency with Linux scripts

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-windows
        with:
          compiler: ${{ inputs.compiler }}

      - name: Build
        uses: ./.github/actions/build-engine
        with:
          cache_prefix: engine-windows
          preset: ci_windows_${{ inputs.compiler }}
