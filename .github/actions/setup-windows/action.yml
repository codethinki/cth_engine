name: 'Setup Windows Environment'
description: 'Sets up MSVC, Vcpkg, BuildCache, CMake and Ninja'
inputs:
  compiler:
    description: 'compiler of the CI preset (msvc or clang)'
    required: true

runs:
  using: "composite"
  steps:
    - uses: ilammy/msvc-dev-cmd@v1

    - name: Setup Vcpkg Environment
      shell: pwsh
      run: |
        $vcpkgPath = $env:VCPKG_INSTALLATION_ROOT
        if (-not (Test-Path "$vcpkgPath")) {
           Write-Error "Vcpkg not found at VCPKG_INSTALLATION_ROOT ($vcpkgPath)"
           exit 1
        }
        "VCPKG_ROOT=$vcpkgPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install BuildCache
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://gitlab.com/bits-n-bites/buildcache/-/releases/v0.31.7/downloads/buildcache-windows.zip" -OutFile "buildcache.zip"
        Expand-Archive buildcache.zip -DestinationPath c:\buildcache
        echo "c:\buildcache\buildcache\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install LLVM
      if: inputs.compiler == 'clang'
      shell: pwsh
      run: |
        $version = "23.1.2"
        $name = "clang+llvm-$version-x86_64-pc-windows-msvc"
        curl.exe -fsSL -o "$env:RUNNER_TEMP\llvm.tar.xz" "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$name.tar.xz"
        cmd /c "7z x %RUNNER_TEMP%\llvm.tar.xz -so | 7z x -si -ttar -oc:\llvm > nul"
        & "c:\llvm\$name\bin\clang++.exe" --version
        echo "c:\llvm\$name\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - uses: actions/setup-python@v7
      with:
        python-version: "3.x"

    - name: Install CMake & Ninja
      run: pip install --upgrade cmake ninja
      shell: powershell
